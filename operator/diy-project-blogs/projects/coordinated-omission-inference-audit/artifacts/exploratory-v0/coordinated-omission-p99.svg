<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-visual-quality="publication" data-text-fit="bounded" role="img" aria-labelledby="title desc"><title id="title">Coordinated omission changes measured p99 latency</title><desc id="desc">Grouped bars compare open-loop, naive closed-loop, and corrected closed-loop p99 latency under bursty server pauses at 80 and 100 requests per second.</desc><style>.bg{fill:#0b1020}.title{font:700 26px Georgia,serif;fill:#f8fafc}.sub{font:15px Georgia,serif;fill:#bac7dc}.label{font:14px Georgia,serif;fill:#dbe5f3}.value{font:700 13px ui-monospace,monospace;fill:#f8fafc}.axis{stroke:#60708f;stroke-width:1}.tick{font:12px ui-monospace,monospace;fill:#93a4bd}</style><rect class="bg" width="960" height="540"/><text x="48" y="52" class="title">A quiet load generator can hide a loud queue</text><text x="48" y="80" class="sub">Median p99 across 320 repeats; milliseconds; lower is better</text><line x1="90" y1="430" x2="900" y2="430" class="axis"/><line x1="90" y1="100" x2="90" y2="430" class="axis"/><line x1="90" y1="375" x2="900" y2="375" class="axis" stroke-dasharray="4 6"/><text x="80" y="379" text-anchor="end" class="tick">100</text><g><rect x="150" y="100" width="52" height="330" rx="4" fill="#ff7a5c"/><text x="176" y="84" text-anchor="middle" class="value">814</text></g><g><rect x="224" y="100" width="52" height="330" rx="4" fill="#4ecdc4"/><text x="250" y="84" text-anchor="middle" class="value">793</text></g><g><rect x="298" y="100" width="52" height="330" rx="4" fill="#a78bfa"/><text x="324" y="84" text-anchor="middle" class="value">783</text></g><text x="250" y="470" text-anchor="middle" class="label">bursty pause 80</text><g><rect x="530" y="100" width="52" height="330" rx="4" fill="#ff7a5c"/><text x="556" y="84" text-anchor="middle" class="value">1351</text></g><g><rect x="604" y="100" width="52" height="330" rx="4" fill="#4ecdc4"/><text x="630" y="84" text-anchor="middle" class="value">807</text></g><g><rect x="678" y="100" width="52" height="330" rx="4" fill="#a78bfa"/><text x="704" y="84" text-anchor="middle" class="value">797</text></g><text x="630" y="470" text-anchor="middle" class="label">bursty pause 100</text><g transform="translate(120 505)"><rect width="14" height="14" fill="#ff7a5c"/><text x="22" y="12" class="label">open loop</text><rect x="160" width="14" height="14" fill="#4ecdc4"/><text x="182" y="12" class="label">closed loop</text><rect x="330" width="14" height="14" fill="#a78bfa"/><text x="352" y="12" class="label">closed + interval correction</text></g></svg>