<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-visual-quality="publication" data-text-fit="bounded" role="img" aria-labelledby="title desc"><title id="title">Prefix affinity trades cache reuse for hot-shard tail latency</title><desc id="desc">Two grouped bar charts compare median p99 latency for random, least-loaded, prefix-affinity, and bounded-affinity routing under moderate and extreme hot-prefix workloads across 200 repeats.</desc><style>.bg{fill:#09111f}.title{font:700 26px Georgia,serif;fill:#f8fafc}.sub,.label{font:15px Georgia,serif;fill:#cbd5e1}.value{font:700 13px ui-monospace,monospace;fill:#f8fafc}.small{font:12px Georgia,serif;fill:#bac7dc}.axis{stroke:#64748b;stroke-width:1}.slo{stroke:#fbbf24;stroke-width:2;stroke-dasharray:7 7}</style><rect class="bg" width="960" height="540"/><text x="48" y="52" class="title">Cache affinity becomes a queue when one prefix gets hot</text><text x="48" y="80" class="sub">Median p99 latency over 200 matched repeats; milliseconds; lower is better</text><line x1="80" y1="420" x2="920" y2="420" class="axis"/><line x1="80" y1="340" x2="920" y2="340" class="slo"/><text x="70" y="344" text-anchor="end" class="small">250 ms SLO</text><g><rect x="120" y="362.7652313917363" width="54" height="57.23476860826369" rx="4" fill="#7dd3fc"/><text x="147" y="347.7652313917363" text-anchor="middle" class="value">179</text><text transform="translate(138 452) rotate(35)" class="small">random</text></g><g><rect x="198" y="394.7281666677876" width="54" height="25.27183333221241" rx="4" fill="#a7f3d0"/><text x="225" y="379.7281666677876" text-anchor="middle" class="value">79</text><text transform="translate(216 452) rotate(35)" class="small">least-loaded</text></g><g><rect x="276" y="130" width="54" height="290" rx="4" fill="#fb7185"/><text x="303" y="115" text-anchor="middle" class="value">4378</text><text transform="translate(294 452) rotate(35)" class="small">prefix-affinity</text></g><g><rect x="354" y="402.67625220462736" width="54" height="17.32374779537262" rx="4" fill="#c4b5fd"/><text x="381" y="387.67625220462736" text-anchor="middle" class="value">54</text><text transform="translate(372 452) rotate(35)" class="small">bounded-affinity</text></g><text x="245" y="505" text-anchor="middle" class="label">moderate hot 120</text><g><rect x="550" y="361.76867039474894" width="54" height="58.231329605251084" rx="4" fill="#7dd3fc"/><text x="577" y="346.76867039474894" text-anchor="middle" class="value">182</text><text transform="translate(568 452) rotate(35)" class="small">random</text></g><g><rect x="628" y="396.02783839286536" width="54" height="23.972161607134623" rx="4" fill="#a7f3d0"/><text x="655" y="381.02783839286536" text-anchor="middle" class="value">75</text><text transform="translate(646 452) rotate(35)" class="small">least-loaded</text></g><g><rect x="706" y="130" width="54" height="290" rx="4" fill="#fb7185"/><text x="733" y="115" text-anchor="middle" class="value">75527</text><text transform="translate(724 452) rotate(35)" class="small">prefix-affinity</text></g><g><rect x="784" y="402.51360785365335" width="54" height="17.486392146346624" rx="4" fill="#c4b5fd"/><text x="811" y="387.51360785365335" text-anchor="middle" class="value">55</text><text transform="translate(802 452) rotate(35)" class="small">bounded-affinity</text></g><text x="675" y="505" text-anchor="middle" class="label">extreme hot 180</text></svg>