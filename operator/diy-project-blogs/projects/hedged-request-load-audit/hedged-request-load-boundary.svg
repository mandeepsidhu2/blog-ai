<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" data-visual-quality="publication" data-text-fit="bounded" role="img" aria-labelledby="title desc"><title id="title">Hedged request p95 latency by load and correlation</title><desc id="desc">Grouped bars show that fixed hedging reduces p95 at moderate load but increases it near capacity, especially when slowdowns correlate, while queue-capped hedging limits the reversal.</desc><style>text{font-family:Georgia,serif;fill:#183247}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#506477}.legend,.axis{font-size:14px}.value{font-size:12px;font-weight:700}.grid{stroke:#d9e2e8;stroke-width:1}</style><rect width="1200" height="675" fill="#f7f4ec"/><text x="72" y="48" class="title">Hedging has a load boundary</text><text x="72" y="70" class="subtitle">Mean p95 latency across 320 matched repeats; seconds, lower is better</text><rect x="130" y="78" width="18" height="18" fill="#60758a"/><text x="156" y="92" class="legend">No hedge</text><rect x="375" y="78" width="18" height="18" fill="#c86b43"/><text x="401" y="92" class="legend">Fixed 250 ms</text><rect x="620" y="78" width="18" height="18" fill="#d7a441"/><text x="646" y="92" class="legend">Fixed 500 ms</text><rect x="865" y="78" width="18" height="18" fill="#2a8c82"/><text x="891" y="92" class="legend">Queue-capped 250 ms</text><line x1="72" y1="420" x2="1125" y2="420" class="grid"/><text x="184" y="468" text-anchor="middle" class="axis">moderate independent</text><rect x="100" y="330.03738740734246" width="32" height="89.96261259265754" fill="#60758a"/><text x="116" y="318.03738740734246" text-anchor="middle" class="value">1.46</text><rect x="142" y="394.057789040286" width="32" height="25.942210959714004" fill="#c86b43"/><text x="158" y="382.057789040286" text-anchor="middle" class="value">0.42</text><rect x="184" y="383.0342712489085" width="32" height="36.96572875109147" fill="#d7a441"/><text x="200" y="371.0342712489085" text-anchor="middle" class="value">0.60</text><rect x="226" y="394.0646507944031" width="32" height="25.935349205596903" fill="#2a8c82"/><text x="242" y="382.0646507944031" text-anchor="middle" class="value">0.42</text><text x="434" y="468" text-anchor="middle" class="axis">near capacity independent</text><rect x="350" y="224.08618575293204" width="32" height="195.91381424706796" fill="#60758a"/><text x="366" y="212.08618575293204" text-anchor="middle" class="value">3.19</text><rect x="392" y="385.85948843739294" width="32" height="34.14051156260705" fill="#c86b43"/><text x="408" y="373.85948843739294" text-anchor="middle" class="value">0.56</text><rect x="434" y="375.7518499411992" width="32" height="44.2481500588008" fill="#d7a441"/><text x="450" y="363.7518499411992" text-anchor="middle" class="value">0.72</text><rect x="476" y="378.56270407979315" width="32" height="41.43729592020684" fill="#2a8c82"/><text x="492" y="366.56270407979315" text-anchor="middle" class="value">0.67</text><text x="684" y="468" text-anchor="middle" class="axis">near capacity correlated</text><rect x="600" y="120" width="32" height="300" fill="#60758a"/><text x="616" y="108" text-anchor="middle" class="value">4.88</text><rect x="642" y="193.0045875055835" width="32" height="226.9954124944165" fill="#c86b43"/><text x="658" y="181.0045875055835" text-anchor="middle" class="value">3.69</text><rect x="684" y="190.88666767293915" width="32" height="229.11333232706085" fill="#d7a441"/><text x="700" y="178.88666767293915" text-anchor="middle" class="value">3.73</text><rect x="726" y="141.16895325888436" width="32" height="278.83104674111564" fill="#2a8c82"/><text x="742" y="129.16895325888436" text-anchor="middle" class="value">4.54</text><text x="934" y="468" text-anchor="middle" class="axis">no tail control</text><rect x="850" y="377.63289548305806" width="32" height="42.36710451694193" fill="#60758a"/><text x="866" y="365.63289548305806" text-anchor="middle" class="value">0.69</text><rect x="892" y="314.2633191984876" width="32" height="105.73668080151245" fill="#c86b43"/><text x="908" y="302.2633191984876" text-anchor="middle" class="value">1.72</text><rect x="934" y="371.27194649419243" width="32" height="48.728053505807566" fill="#d7a441"/><text x="950" y="359.27194649419243" text-anchor="middle" class="value">0.79</text><rect x="976" y="371.82765833524866" width="32" height="48.17234166475135" fill="#2a8c82"/><text x="992" y="359.82765833524866" text-anchor="middle" class="value">0.78</text><text x="72" y="540" class="subtitle">Fixed-delay duplicates consume spare capacity. Correlated slowdowns reduce the chance that the second copy escapes the tail.</text><text x="72" y="574" class="axis">Synthetic 8-worker FCFS service; 1,600 requests/repeat; 8 s deadline. Mechanism evidence, not a provider estimate.</text></svg>
