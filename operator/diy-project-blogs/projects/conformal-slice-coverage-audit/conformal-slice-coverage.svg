<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" data-visual-quality="publication" data-text-fit="bounded" role="img" aria-labelledby="title desc"><title id="title">Critical-slice conformal coverage by calibration policy</title><desc id="desc">Grouped bars show pooled conformal intervals miss the ninety percent target on a rare high-noise slice even when marginal exchangeability holds, while slice-calibrated and correctly normalized intervals restore critical-slice coverage.</desc><style>text{font-family:Georgia,serif;fill:#183247}.title{font-size:30px;font-weight:700}.subtitle{font-size:17px;fill:#506477}.legend,.axis{font-size:14px}.value{font-size:13px;font-weight:700}.grid{stroke:#c8d5dc;stroke-width:2;stroke-dasharray:7 7}</style><rect width="1200" height="675" fill="#f7f4ec"/><text x="68" y="52" class="title">Marginal coverage can abandon the critical slice</text><text x="68" y="76" class="subtitle">Mean critical-slice coverage across 800 matched repeats; target = 90%</text><rect x="190" y="92" width="20" height="20" fill="#c45f3c"/><text x="220" y="108" class="legend">Pooled</text><rect x="460" y="92" width="20" height="20" fill="#237f78"/><text x="490" y="108" class="legend">Slice-calibrated</text><rect x="730" y="92" width="20" height="20" fill="#375b8c"/><text x="760" y="108" class="legend">Normalized</text><line x1="76" y1="160" x2="1130" y2="160" class="grid"/><text x="80" y="151" class="axis">90% target</text><line x1="76" y1="430" x2="1130" y2="430" stroke="#8da0ad"/><text x="224" y="502" text-anchor="middle" class="axis">exchangeable rare noisy</text><rect x="120" y="296.1428764925323" width="48" height="133.8571235074677" fill="#c45f3c"/><text x="144" y="282.1428764925323" text-anchor="middle" class="value">44.6%</text><rect x="190" y="159.38438297992747" width="48" height="270.61561702007253" fill="#237f78"/><text x="214" y="145.38438297992747" text-anchor="middle" class="value">90.2%</text><rect x="260" y="159.6291620252884" width="48" height="270.3708379747116" fill="#375b8c"/><text x="284" y="145.6291620252884" text-anchor="middle" class="value">90.1%</text><text x="564" y="502" text-anchor="middle" class="axis">shifted critical share</text><rect x="460" y="296.20319470308806" width="48" height="133.79680529691194" fill="#c45f3c"/><text x="484" y="282.20319470308806" text-anchor="middle" class="value">44.6%</text><rect x="530" y="159.167999056432" width="48" height="270.832000943568" fill="#237f78"/><text x="554" y="145.167999056432" text-anchor="middle" class="value">90.3%</text><rect x="600" y="159.92750888902077" width="48" height="270.07249111097923" fill="#375b8c"/><text x="624" y="145.92750888902077" text-anchor="middle" class="value">90.0%</text><text x="904" y="502" text-anchor="middle" class="axis">equal noise control</text><rect x="800" y="160.07586925013504" width="48" height="269.92413074986496" fill="#c45f3c"/><text x="824" y="146.07586925013504" text-anchor="middle" class="value">90.0%</text><rect x="870" y="159.3235694735174" width="48" height="270.6764305264826" fill="#237f78"/><text x="894" y="145.3235694735174" text-anchor="middle" class="value">90.2%</text><rect x="940" y="160.07586925013504" width="48" height="269.92413074986496" fill="#375b8c"/><text x="964" y="146.07586925013504" text-anchor="middle" class="value">90.0%</text><text x="68" y="566" class="subtitle">The equal-noise control removes the gap. The heteroscedastic cells require a declared conditional-coverage policy.</text><text x="68" y="600" class="axis">Synthetic absolute residuals; 4,000 calibration and 12,000 test cases per repeat. Mechanism evidence, not a model benchmark.</text></svg>
