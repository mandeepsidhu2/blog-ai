<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" data-text-fit="bounded" role="img" aria-labelledby="title desc" data-visual-quality="publication" data-visual-system="fieldbook-v2">
  <title id="title">Qwen3.7 Flash model-pilot decision surface</title>
  <desc id="desc">A comparison matrix shows Qwen's strong public price and multimodal contract alongside missing exact-endpoint benchmark and safety evidence, with incumbent models offering different evidence and cost profiles.</desc>
  <!-- fieldbook-visual-system:v2 -->
  <defs id="fieldbook-v2-defs">
    <pattern id="fieldbook-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27323d" stroke-width="1"/>
    </pattern>
  </defs>
  <g aria-hidden="true" data-fieldbook-frame="background">
    <rect width="1200" height="675" fill="#080c12"/>
    <rect width="1200" height="675" fill="url(#fieldbook-grid)" opacity="0.32"/>
  </g>
  <style>text{font-family:Georgia,serif;fill:#173249}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#526779}.head{font-size:17px;font-weight:700}.body{font-size:15px}.metric{font-size:13px;fill:#526779}.good{fill:#237f78}.warn{fill:#c66a3d}.neutral{fill:#466987}.grid{stroke:#cbd7dd;stroke-width:1}</style>

  <text x="64" y="52" class="title">Price is evidence for a pilot, not a migration</text>
  <text x="64" y="78" class="sub">Public contracts checked July 31, 2026; exact harness comparability remains missing</text>
  <text x="288" y="128" text-anchor="middle" class="head">Qwen3.7 Flash</text><text x="528" y="128" text-anchor="middle" class="head">GPT-5.6 Luna</text><text x="768" y="128" text-anchor="middle" class="head">Gemini 3.5 Flash</text><text x="1008" y="128" text-anchor="middle" class="head">Claude Sonnet 5</text>
  <text x="70" y="178" class="head">Input $/MTok</text><text x="70" y="258" class="head">Output $/MTok</text><text x="70" y="338" class="head">Context</text><text x="70" y="418" class="head">Modalities</text><text x="70" y="498" class="head">Evidence</text>
  <g class="grid"><line x1="180" y1="145" x2="1135" y2="145"/><line x1="180" y1="225" x2="1135" y2="225"/><line x1="180" y1="305" x2="1135" y2="305"/><line x1="180" y1="385" x2="1135" y2="385"/><line x1="180" y1="465" x2="1135" y2="465"/><line x1="180" y1="545" x2="1135" y2="545"/><line x1="408" y1="105" x2="408" y2="545"/><line x1="648" y1="105" x2="648" y2="545"/><line x1="888" y1="105" x2="888" y2="545"/></g>
  <text x="288" y="190" text-anchor="middle" class="body">$0.03</text><text x="528" y="190" text-anchor="middle" class="body">$0.20</text><text x="768" y="190" text-anchor="middle" class="body">tier varies</text><text x="1008" y="190" text-anchor="middle" class="body">$2 intro</text>
  <text x="288" y="270" text-anchor="middle" class="body">$0.13</text><text x="528" y="270" text-anchor="middle" class="body">$1.20</text><text x="768" y="270" text-anchor="middle" class="body">tier varies</text><text x="1008" y="270" text-anchor="middle" class="body">$10 intro</text>
  <text x="288" y="350" text-anchor="middle" class="body">1M</text><text x="528" y="350" text-anchor="middle" class="body">1.05M</text><text x="768" y="350" text-anchor="middle" class="body">1M</text><text x="1008" y="350" text-anchor="middle" class="body">1M</text>
  <text x="288" y="420" text-anchor="middle" class="body"><tspan x="288">text · image</tspan><tspan x="288" dy="20">video</tspan></text><text x="528" y="420" text-anchor="middle" class="body"><tspan x="528">text · image</tspan><tspan x="528" dy="20">text output</tspan></text><text x="768" y="420" text-anchor="middle" class="body"><tspan x="768">text · image</tspan><tspan x="768" dy="20">audio · video</tspan></text><text x="1008" y="420" text-anchor="middle" class="body"><tspan x="1008">multimodal</tspan><tspan x="1008" dy="20">platform</tspan></text>
  <rect x="218" y="486" width="140" height="14" class="warn"/><text x="288" y="525" text-anchor="middle" class="metric">exact scores missing</text><rect x="458" y="486" width="140" height="14" class="neutral"/><text x="528" y="525" text-anchor="middle" class="metric">provider evaluations</text><rect x="698" y="486" width="140" height="14" class="good"/><text x="768" y="525" text-anchor="middle" class="metric">dated model card</text><rect x="938" y="486" width="140" height="14" class="neutral"/><text x="1008" y="525" text-anchor="middle" class="metric">system card + expiry</text>
  <text x="64" y="595" class="sub">Release gate: completed-task quality × schema validity × tool safety × p95 latency × observed cost</text>
  <text x="64" y="626" class="metric">Rates and limits are mutable provider claims; benchmark settings differ and are not directly comparable.</text>
  <style id="fieldbook-v2-theme">
    text { fill: #e4eaed !important; font-family: Inter, system-ui, sans-serif !important; letter-spacing: 0; }
    .title { fill: #f7faf9 !important; font-weight: 750 !important; }
    .subtitle, .sub, .note, .axis, .legend, .body, .small { fill: #8d9aa6 !important; }
    .label, .smallTitle, .metric, .headtext { fill: #e7edef !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .fieldbook-kicker { fill: #73818e !important; font-family: ui-monospace, SFMono-Regular, Consolas, monospace !important; font-size: 13px !important; font-weight: 750 !important; }
  </style>
  <g aria-hidden="true" data-fieldbook-frame="overlay">
    <circle cx="28" cy="26" r="4" fill="#b8f56a"/>
    <circle cx="42" cy="26" r="4" fill="#52dcef"/>
    <text class="fieldbook-kicker" x="1176" y="30" text-anchor="end">AI SYSTEMS FIELDBOOK / SYSTEM ARCHITECTURE</text>
    <rect x="0.5" y="0.5" width="1199" height="674" rx="8" fill="none" stroke="#2b3742" stroke-width="1"/>
  </g>
</svg>
