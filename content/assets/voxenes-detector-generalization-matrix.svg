<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" data-text-fit="bounded" role="img" aria-labelledby="title desc" data-visual-quality="publication" data-visual-system="fieldbook-v2">
  <title id="title">Overall equal error rate of eight detectors on VoxENES 2026</title>
  <desc id="desc">Horizontal bars show overall equal error rates from 28.98 percent for AST-ASVspoof5 to 57.86 percent for AASIST2, with a vertical 50 percent random-baseline marker.</desc>
  <!-- fieldbook-visual-system:v2 -->
  <defs id="fieldbook-v2-defs">
    <pattern id="fieldbook-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27323d" stroke-width="1"/>
    </pattern>
  </defs>
  <g aria-hidden="true" data-fieldbook-frame="background">
    <rect width="960" height="540" fill="#080c12"/>
    <rect width="960" height="540" fill="url(#fieldbook-grid)" opacity="0.32"/>
  </g>
  <style>.bg{fill:#0b1020}.title{font:700 25px Georgia,serif;fill:#101720}.sub{font:14px Georgia,serif;fill:#aebdd3}.name{font:13px ui-monospace,monospace;fill:#dbe5f3}.value{font:700 13px ui-monospace,monospace;fill:#101720}.axis{stroke:#60708f;stroke-width:1}.random{stroke:#ff7a5c;stroke-width:2;stroke-dasharray:5 5}.bar{fill:#4ecdc4}.best{fill:#a78bfa}</style>

  <text x="42" y="48" class="title">Modern generators break historical detector confidence</text>
  <text x="42" y="74" class="sub">VoxENES 2026 overall EER (%) • lower is better • frozen checkpoints</text>
  <line x1="260" y1="100" x2="260" y2="480" class="axis"/><line x1="260" y1="480" x2="900" y2="480" class="axis"/>
  <line x1="793" y1="96" x2="793" y2="480" class="random"/><text x="793" y="92" text-anchor="middle" class="sub">50% random baseline</text>
  <g><text x="244" y="132" text-anchor="end" class="name">AST-ASVspoof5</text><rect x="260" y="114" width="309" height="24" rx="4" class="best"/><text x="578" y="132" class="value">28.98</text></g>
  <g><text x="244" y="176" text-anchor="end" class="name">W2V-AASIST</text><rect x="260" y="158" width="418" height="24" rx="4" class="bar"/><text x="687" y="176" class="value">39.16</text></g>
  <g><text x="244" y="220" text-anchor="end" class="name">ECAPA-TDNN</text><rect x="260" y="202" width="461" height="24" rx="4" class="bar"/><text x="730" y="220" class="value">43.22</text></g>
  <g><text x="244" y="264" text-anchor="end" class="name">W2V-Large</text><rect x="260" y="246" width="473" height="24" rx="4" class="bar"/><text x="742" y="264" class="value">44.38</text></g>
  <g><text x="244" y="308" text-anchor="end" class="name">RawNet2</text><rect x="260" y="290" width="502" height="24" rx="4" class="bar"/><text x="771" y="308" class="value">47.03</text></g>
  <g><text x="244" y="352" text-anchor="end" class="name">W2V-ASV5</text><rect x="260" y="334" width="550" height="24" rx="4" fill="#ffb454"/><text x="819" y="352" class="value">51.53</text></g>
  <g><text x="244" y="396" text-anchor="end" class="name">W2V-DF</text><rect x="260" y="378" width="592" height="24" rx="4" fill="#ff9f7a"/><text x="861" y="396" class="value">55.51</text></g>
  <g><text x="244" y="440" text-anchor="end" class="name">AASIST2</text><rect x="260" y="422" width="617" height="24" rx="4" fill="#ff7a5c"/><text x="886" y="440" class="value">57.86</text></g>
  <text x="260" y="510" class="sub">Source: Sharma &amp; Wang, arXiv:2607.11706v1, Table 7 (2026-07-13)</text>
  <style id="fieldbook-v2-theme">
    text { fill: #e4eaed !important; font-family: Inter, system-ui, sans-serif !important; letter-spacing: 0; }
    .title { fill: #f7faf9 !important; font-weight: 750 !important; }
    .subtitle, .sub, .note, .axis, .legend, .body, .small { fill: #8d9aa6 !important; }
    .label, .smallTitle, .metric, .headtext { fill: #e7edef !important; }
    path, line, polyline { stroke-linecap: round; stroke-linejoin: round; }
    .fieldbook-kicker { fill: #73818e !important; font-family: ui-monospace, SFMono-Regular, Consolas, monospace !important; font-size: 11px !important; font-weight: 750 !important; }
  </style>
  <g aria-hidden="true" data-fieldbook-frame="overlay">
    <line x1="24" y1="116" x2="936" y2="116" stroke="#2a3641" stroke-width="1"/>
    <circle cx="28" cy="26" r="4" fill="#b8f56a"/>
    <circle cx="42" cy="26" r="4" fill="#52dcef"/>
    <text class="fieldbook-kicker" x="936" y="30" text-anchor="end">AI SYSTEMS FIELDBOOK / SYSTEM ARCHITECTURE</text>
    <rect x="0.5" y="0.5" width="959" height="539" rx="8" fill="none" stroke="#2b3742" stroke-width="1"/>
  </g>
</svg>
