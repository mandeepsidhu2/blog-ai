  </g><style>.bg{fill:#08121d}.h{font:700 27px Georgia,serif;fill:#101720}.s{font:15px Georgia,serif;fill:#334250}.l{font:13px Georgia,serif;fill:#102938}.v{font:700 13px ui-monospace,monospace;fill:#101720}.axis{stroke:#475569}.old{fill:#64748b}.new{fill:#22d3ee}.line{stroke:#22d3ee;stroke-width:4}.panel{fill:#102235;stroke:#31506b;rx:8}.warn{fill:#ffb84d}</style><text x="42" y="48" class="h">0731 moves the benchmark dots; your harness decides portability</text><text x="42" y="76" class="s">Provider-reported scores, same named model family; preview → 0731</text><line x1="245" y1="118" x2="690" y2="118" class="axis"/><text x="245" y="105" class="l">0</text><text x="675" y="105" class="l">100</text><g class="l"><text x="42" y="150">Terminal-Bench 2.1</text><text x="42" y="205">NL2Repo</text><text x="42" y="260">CyberGym</text><text x="42" y="315">DeepSWE</text><text x="42" y="370">Toolathlon-Verified</text></g><g><line x1="520" y1="145" x2="613" y2="145" class="line"/><circle cx="520" cy="145" r="7" class="old"/><circle cx="613" cy="145" r="8" class="new"/><text x="625" y="150" class="v">82.7</text><line x1="420" y1="200" x2="486" y2="200" class="line"/><circle cx="420" cy="200" r="7" class="old"/><circle cx="486" cy="200" r="8" class="new"/><text x="498" y="205" class="v">54.2</text><line x1="417" y1="255" x2="586" y2="255" class="line"/><circle cx="417" cy="255" r="7" class="old"/><circle cx="586" cy="255" r="8" class="new"/><text x="598" y="260" class="v">76.7</text><line x1="277" y1="310" x2="487" y2="310" class="line"/><circle cx="277" cy="310" r="7" class="old"/><circle cx="487" cy="310" r="8" class="new"/><text x="499" y="315" class="v">54.4</text><line x1="466" y1="365" x2="558" y2="365" class="line"/><circle cx="466" cy="365" r="7" class="old"/><circle cx="558" cy="365" r="8" class="new"/><text x="570" y="370" class="v">70.3</text></g><rect x="716" y="112" width="208" height="286" class="panel"/><text x="734" y="143" class="s">Adoption boundary</text><circle cx="739" cy="177" r="5" class="warn"/><text x="753" y="181" class="l">Unreleased harness</text><circle cx="739" cy="218" r="5" class="warn"/><text x="753" y="222" class="l">Max effort only</text><circle cx="739" cy="259" r="5" class="warn"/><text x="753" y="263" class="l">Internal DSBench rows</text><circle cx="739" cy="300" r="5" class="warn"/><text x="753" y="304" class="l">4×GB300 recipe</text><circle cx="739" cy="341" r="5" class="warn"/><text x="753" y="345" class="l">384K output cap</text><text x="42" y="438" class="s">Decision: replay your tasks with fixed harness, effort, tool budget, and completed-task cost.</text><text x="42" y="472" class="l">Blue = 0731 • gray = preview • values are not cross-benchmark comparable</text>
