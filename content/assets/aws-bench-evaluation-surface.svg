<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-text-fit="bounded" data-visual-quality="publication" data-visual-system="fieldbook-v2"><title id="title">aws-bench evaluation surface</title><desc id="desc">A matrix compares quickstart, basic, and advanced datasets by task count, scenario count, verifier type, and the engineering decision each can support.</desc>
  <!-- fieldbook-visual-system:v2 -->
  <defs id="fieldbook-v2-defs">
    <pattern id="fieldbook-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#27323d" stroke-width="1"/>
    </pattern>
  </defs>
  <g aria-hidden="true" data-fieldbook-frame="background">
    <rect width="1200" height="675" fill="#080c12"/>
    <rect width="1200" height="675" fill="url(#fieldbook-grid)" opacity="0.32"/>
  </g><style>text{font-family:Georgia,serif;fill:#17364a}.title{font-size:30px;font-weight:700}.sub{font-size:17px;fill:#536977}.head{font-size:15px;font-weight:700}.cell{font-size:15px}.num{font-size:28px;font-weight:700}.line{stroke:#b9c8cf;stroke-width:1}.accent{fill:#227f7a}.warn{fill:#c96b42}.muted{fill:#e9e5da}</style><text x="70" y="55" class="title">aws-bench is an authority-bearing evaluation</text><text x="70" y="82" class="sub">July 24, 2026 research preview · separate diagnosis from mutation</text><rect x="70" y="125" width="1060" height="430" fill="#fffdf7" stroke="#b9c8cf"/><line x1="70" y1="190" x2="1130" y2="190" class="line"/><line x1="70" y1="305" x2="1130" y2="305" class="line"/><line x1="70" y1="420" x2="1130" y2="420" class="line"/><line x1="290" y1="125" x2="290" y2="555" class="line"/><line x1="455" y1="125" x2="455" y2="555" class="line"/><line x1="620" y1="125" x2="620" y2="555" class="line"/><line x1="850" y1="125" x2="850" y2="555" class="line"/><text x="95" y="165" class="head">Dataset</text><text x="325" y="165" class="head">Tasks</text><text x="485" y="165" class="head">Scenarios</text><text x="650" y="165" class="head">Reward path</text><text x="880" y="165" class="head">Decision boundary</text><text x="95" y="245" class="head">Quickstart</text><text x="330" y="252" class="num">9</text><text x="500" y="252" class="num">1</text><text x="650" y="240" class="cell">Lifecycle smoke test</text><text x="880" y="235" class="cell">Installation only</text><text x="880" y="260" class="cell">Not an agent rank</text><text x="95" y="360" class="head">Basic</text><text x="325" y="367" class="num">78</text><text x="500" y="367" class="num">4</text><circle cx="668" cy="360" r="9" class="accent"/><text x="688" y="365" class="cell">Judge + state checks</text><text x="880" y="350" class="cell">Low-complexity baseline</text><text x="880" y="375" class="cell">Report task families apart</text><text x="95" y="475" class="head">Advanced</text><text x="325" y="482" class="num">47</text><text x="500" y="482" class="num">3</text><circle cx="668" cy="475" r="9" class="warn"/><text x="688" y="480" class="cell">Live mutation included</text><text x="880" y="465" class="cell">Multi-service stress</text><text x="880" y="490" class="cell">Requires isolated accounts</text><text x="70" y="600" class="sub">Pin dataset + harness + agent + model + role + verifier. Binary rewards are not comparable without the full tuple.</text><rect x="70" y="625" width="1060" height="5" class="accent"/>
  <style id="fieldbook-v2-theme">
