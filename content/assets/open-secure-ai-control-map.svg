<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" data-text-fit="bounded" data-visual-quality="publication" data-visual-system="fieldbook-v2"><title id="title">Open Secure AI control evidence map</title><desc id="desc">Four vertical evidence lanes connect the new alliance signal to threat catalogs, provenance, operational containment, and vulnerability repair artifacts.</desc>
